
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transport-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transport-dashboard
  template:
    metadata:
      labels:
        app: transport-dashboard
    spec:
      containers:
        - name: transport-dashboard
          image: gouthmi06/transport-dashboard:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: transport-dashboard-service
spec:
  type: NodePort
  selector:
    app: transport-dashboard
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
